name: Spring Boot Docker Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 21 환경 구성
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 3. Gradle 빌드
      - name: Build Spring Boot
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar

      # 4. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. GHCR 로그인
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Docker 이미지 생성 및 GHCR Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 7. Oracle VM에 SSH 접속하여 배포
      - name: Deploy to Oracle VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          echo "$VM_SSH_KEY" > ~/.ssh/oracle_vm
          chmod 600 ~/.ssh/oracle_vm

          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/oracle_vm "$VM_USER@$VM_HOST" << 'EOF'
            cd /home/ubuntu/springboot

            docker compose pull

            docker compose up -d

            docker image prune -f
          EOF