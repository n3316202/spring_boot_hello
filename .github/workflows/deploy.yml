name: Spring Boot Auto Deploy

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: [self-hosted, linux, x64]

    steps:

      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v5

      # 2. Java 21 확인
      - name: Check Java
        run: |
          java -version

      # 3. Gradle 빌드
      - name: Build Spring Boot
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar

      # 4. 기존 컨테이너 중지
      - name: Stop old container
        run: |
          docker compose down

      # 5. 새 Docker 이미지 생성
      - name: Build Docker image
        run: |
          docker compose build --no-cache

      # 6. 새 컨테이너 실행
      - name: Start container
        run: |
          docker compose up -d

      # 7. 상태 확인
      - name: Check container
        run: |
          docker ps

      # 8. 오래된 이미지 정리
      - name: Cleanup
        run: |
          docker image prune -f