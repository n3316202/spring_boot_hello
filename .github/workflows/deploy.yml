name: Spring Boot Auto Deploy

on:
  push:
    branches:
      - main

jobs:

  deploy:

    runs-on: [self-hosted, linux, x64]

    steps:

      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v5


      # 2. Java 21 확인
      - name: Check Java
        run: |
          java -version


      # 3. Docker 확인
      - name: Check Docker
        run: |
          docker --version
          docker compose version


      # 4. Spring Boot Gradle 빌드
      - name: Build Spring Boot
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar


      # 5. 기존 컨테이너 중지
      - name: Stop old containers
        run: |
          docker compose down


      # 6. Frontend + Backend Docker 이미지 생성
      - name: Build Docker images
        run: |
          docker compose build --no-cache


      # 7. 새 컨테이너 실행
      - name: Start containers
        run: |
          docker compose up -d


      # 8. 컨테이너 상태 확인
      - name: Check containers
        run: |
          docker compose ps
          docker ps


      # 9. Backend API 테스트
      - name: Test Backend API
        run: |
          sleep 10
          curl -f http://localhost/api/hello


      # 10. 오래된 Docker 이미지 정리
      - name: Cleanup
        run: |
          docker image prune -f

