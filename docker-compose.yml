services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: backend

    expose:
      - "8080"

    restart: unless-stopped